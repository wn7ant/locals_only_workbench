services:
  wallabag:
    image: wallabag/wallabag:latest
    container_name: wallabag
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3016:80"

    environment:
      TZ: "America/Denver"
      SYMFONY__ENV__DATABASE_DRIVER: "pdo_sqlite"
      SYMFONY__ENV__DOMAIN_NAME: "http://wallabag.vinzant.me"
      SYMFONY__ENV__SERVER_NAME: "Wallabag"
      SYMFONY__ENV__FOSUSER_REGISTRATION: "false"

    volumes:
      - "$HOME/docker/wallabag/data:/var/www/wallabag/data"
      - "$HOME/docker/wallabag/images:/var/www/wallabag/web/assets/images"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    hostname: freshrss
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3015:80"

    environment:
      TZ: "America/Denver"
      CRON_MIN: "3,33"
      TRUSTED_PROXY: "172.18.0.0/16"

    volumes:
      - "$HOME/docker/freshrss/data:/var/www/FreshRSS/data"
      - "$HOME/docker/freshrss/extensions:/var/www/FreshRSS/extensions"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3014:9090"

    volumes:
      - "$HOME/docker/linkding/data:/etc/linkding/data"

    environment:
      LD_SUPERUSER_NAME: "everett"
      LD_SUPERUSER_PASSWORD: "${LD_SUPERUSER_PASSWORD}"
      LD_CSRF_TRUSTED_ORIGINS: "https://links.vinzant.me,http://links.vinzant.me,http://localhost:3014"
      LD_USE_X_FORWARDED_HOST: "True"
      LD_LOG_X_FORWARDED_FOR: "True"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "80:80"

    volumes:
      - "$HOME/docker/caddy/config/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "$HOME/docker/caddy/data:/data"
      - "$HOME/docker/caddy/config:/config"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3013:8090"

    environment:
      APP_URL: "http://localhost:3013"

    volumes:
      - "$HOME/docker/beszel/data:/beszel_data"
      - "$HOME/docker/beszel/socket:/beszel_socket"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped

    networks:
      - pihole-net

    volumes:
      - "$HOME/docker/beszel/agent-data:/var/lib/beszel-agent"
      - "$HOME/docker/beszel/socket:/beszel_socket"
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      LISTEN: "/beszel_socket/beszel.sock"
      HUB_URL: "http://beszel:8090"
      KEY: "${BESZEL_KEY}"
      TOKEN: "${BESZEL_TOKEN}"

    labels:
      com.centurylinklabs.watchtower.enable: "true"  

  gitea:
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3012:3000"
      - "2222:22"

    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: "localhost"
      GITEA__server__ROOT_URL: "http://localhost:3012/"
      GITEA__server__SSH_DOMAIN: "localhost"
      GITEA__server__SSH_PORT: "2222"

    volumes:
      - "$HOME/docker/gitea/data:/data"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3011:80"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    container_name: cyberchef
    restart: unless-stopped
    
    networks:
      - pihole-net
    
    ports:
      - "3010:8080"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  silverbullet:
    image: zefhemel/silverbullet:latest
    container_name: silverbullet
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3002:3000"

    volumes:
      - "$HOME/docker/silverbullet/space:/space"

    environment:
      SB_USER: "${SB_USER}"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped

    networks:
      - pihole-net

    ports:
      - "3000:3000"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: "homepage.vinzant.me,localhost:3000,127.0.0.1:3000"  

    volumes:
      - "$HOME/docker/homepage/config:/app/config"
      - /var/run/docker.sock:/var/run/docker.sock:ro

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  uptime:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    
    networks:
      - pihole-net
    
    ports:

      - "3001:3001"

    volumes:

      - "$HOME/docker/uptime-kuma/data:/app/data"
      - /var/run/docker.sock:/var/run/docker.sock:ro

  logviewer:
    image: amir20/dozzle:latest
    container_name: logviewer
    restart: unless-stopped
    
    networks:
      - pihole-net
    
    ports:
      - "9999:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    networks:
      pihole-net:
        ipv4_address: 172.18.0.11

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"

    environment:
      TZ: "America/Denver"
      FTLCONF_webserver_api_password: "${PIHOLE_WEB_PASSWORD}"
      FTLCONF_dns_upstreams: "172.18.0.200"
      FTLCONF_dns_listeningMode: "ALL"

    volumes:
      - "$HOME/docker/pihole/etc-pihole:/etc/pihole"
      - "$HOME/docker/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

    depends_on:
      - unbound

  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped

    networks:
      pihole-net:
        ipv4_address: 172.18.0.200

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped

    networks:
      - pihole-net

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      DOCKER_API_VERSION: "1.40"

    command:
      - --label-enable
      - --schedule
      - "0 0 4 * * *"

networks:
  pihole-net:
    name: pihole-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
